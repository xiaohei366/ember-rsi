name: Sync merged code

'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Bridge operation
        type: choice
        default: check
        options: [check]

permissions: {}

jobs:
  bot-email-check:
    if: ${{ inputs.operation == 'check' && github.ref == 'refs/heads/codex/bridge-v4-email-check-20261116' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: bridge-sync
    steps:
      - name: Verify the bot account and seal its confirmed email
        env:
          BRIDGE_TARGET_TOKEN: ${{ secrets.BRIDGE_TARGET_TOKEN }}
          BRIDGE_CONFIG_JSON: ${{ secrets.BRIDGE_CONFIG_JSON }}
        run: |
          set -eu
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          cat >"$key" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAkl2r/zfJdjZt9QlPoXUa
          i0Xqn/nfI0Mruqc6WFKk5HLh2HCh6Zmro79yZ0LOyyA8sp32W6DNvEBGBeqd7c49
          e8AsG8Gujm58mK7/vPzVx4pBHOoTaXnWIdBJ7UCc3iiQqXbidvWmvj/TxJAysg4m
          z7UwoZfrSlscj1DnU79qgT7xtvqFG93kI7VxjrlFASamNE/ztSy1+H97f5MVcKJN
          d2Q2ufkQcGyHWxfc5PlAecdcLFI/xKCxnOelJmiyo1MDm3PpUHHiU/HrG3kjwoXr
          JpV7K8hC4Zxa5T8B6l4eWPvrzf7PSvavVB/QN3cV95OtFS5LtSoH+ehOWFFBVIII
          21J66e/Sj27o7xCo2FVsVZjgJHJ/XU26pyhSH9sitZCVdLBGcAe0CCXaQK9kff3p
          NwZj4JAKwHYvmIwfi3C7UX0TZILy3KwPCSip6AOCsx+DGTFUNlAYNU927SXvWNWl
          OTHrYJOFAW5vmf8ETdwsqTF++4vFFMOkbvS6cIpzvSYnAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          python3 - "$key" <<'PYCODE'
          import base64
          import json
          import os
          import subprocess
          import sys
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          def get(endpoint):
              request = Request('https://api.gitcode.com/api/v5/' + endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['BRIDGE_TARGET_TOKEN'],
                  'Accept': 'application/json',
                  'User-Agent': 'bridge-preflight/1.0',
              })
              with build_opener(NoRedirect()).open(request, timeout=20) as response:
                  return json.load(response)

          config = json.loads(os.environ['BRIDGE_CONFIG_JSON'])['gitcode']['bot']
          profile = get('user')
          if str(profile['id']) != config['id'] or profile['login'].casefold() != config['username'].casefold():
              sys.exit('The destination token does not match the configured bot')
          rows = get('emails')
          if isinstance(rows, dict):
              rows = [rows]
          confirmed = {row['email'] for row in rows if row.get('state') == 'confirmed'}
          unconfirmed = sum(row.get('state') in ('unconfirmed', 'pending') for row in rows)
          print(f'Email endpoint returned {len(rows)} address records, {len(confirmed)} confirmed, {unconfirmed} pending or unconfirmed')
          preferred = profile.get('email')
          print(f'The authenticated profile exposes a preferred email: {bool(preferred)}')
          matches = sorted(key for key, value in profile.items()
                           if isinstance(value, str) and value == config['email'])
          print(f'Authenticated alias match fields: {matches}')
          if config['email'] in confirmed:
              selected = config['email']
          elif preferred in confirmed:
              selected = preferred
          elif len(confirmed) == 1:
              selected = next(iter(confirmed))
          else:
              sys.exit(f'The bot account has {len(confirmed)} confirmed email addresses and no confirmed preferred address')
          encrypted = subprocess.check_output([
              'openssl', 'pkeyutl', '-encrypt', '-pubin', '-inkey', sys.argv[1],
              '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256',
              '-pkeyopt', 'rsa_mgf1_md:sha256',
          ], input=selected.encode('utf-8'))
          print('BRIDGE_EMAIL_SEALED ' + base64.b64encode(encrypted).decode('ascii'))
          PYCODE
