name: Sync merged code

'on':
  push:
    branches: ['**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect or resume synchronization to the selected revision
        type: choice
        default: check
        options:
          - check
          - apply

permissions: {}

jobs:
  bridge:
    if: ${{ github.event_name == 'schedule' || (!github.event.deleted && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: gitcode-sync
    concurrency:
      group: gitcode-sync
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the merged source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply the selected operation
        env:
          GITCODE_SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'apply' }}
          GITCODE_SYNC_CONFIG_JSON: ${{ secrets.GITCODE_SYNC_CONFIG_JSON }}
          GITCODE_ROBOT_TOKEN: ${{ secrets.GITCODE_ROBOT_TOKEN }}
          GITCODE_MEMBER_1_TOKEN: ${{ secrets.GITCODE_MEMBER_1_TOKEN }}
          GITCODE_MEMBER_2_TOKEN: ${{ secrets.GITCODE_MEMBER_2_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          : "${GITCODE_SYNC_CONFIG_JSON:?Set GITCODE_SYNC_CONFIG_JSON in the gitcode-sync environment}"
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "$GITCODE_SYNC_CONFIG_JSON" > "$config"
          case "$GITCODE_SYNC_MODE" in
            check|apply) ;;
            *) echo 'GITCODE_SYNC_MODE must be check or apply' >&2; exit 1 ;;
          esac
          python3 -u controller/bridge.py --config "$config" --members .github/gitcode-members.json "--$GITCODE_SYNC_MODE"
