name: Sync merged code

'on':
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      operation:
        description: Preview or apply the GitHub default branch file tree
        type: choice
        default: check
        options:
          - check
          - apply

permissions: {}

jobs:
  bridge:
    if: ${{ !github.event.deleted && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gitcode-sync
    concurrency:
      # Keep the same GitHub queue while the destination checkpoint branch is renamed.
      group: bridge-state
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the merged source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Apply the selected operation
        env:
          GITCODE_SYNC_MODE: ${{ github.event_name == 'push' && 'apply' || inputs.operation }}
          GITCODE_SYNC_CONFIG_JSON: ${{ secrets.GITCODE_SYNC_CONFIG_JSON }}
          GITCODE_REBOT_TOKEN: ${{ secrets.GITCODE_REBOT_TOKEN }}
          GITCODE_MEMBER_1_TOKEN: ${{ secrets.GITCODE_MEMBER_1_TOKEN }}
          GITCODE_MEMBER_2_TOKEN: ${{ secrets.GITCODE_MEMBER_2_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          : "${GITCODE_SYNC_CONFIG_JSON:?Set GITCODE_SYNC_CONFIG_JSON in the gitcode-sync environment}"
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "$GITCODE_SYNC_CONFIG_JSON" > "$config"
          case "$GITCODE_SYNC_MODE" in
            check|apply) ;;
            *) echo 'GITCODE_SYNC_MODE must be check or apply' >&2; exit 1 ;;
          esac
          python3 -u controller/bridge.py --config "$config" "--$GITCODE_SYNC_MODE"
