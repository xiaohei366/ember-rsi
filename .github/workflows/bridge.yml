name: Sync merged code

'on':
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      operation:
        description: Preview or apply the GitHub default branch file tree
        type: choice
        default: check
        options:
          - check
          - apply

permissions: {}

jobs:
  bridge:
    if: ${{ !github.event.deleted && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: bridge-sync
    concurrency:
      group: bridge-state
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the merged source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Apply the selected operation
        env:
          BRIDGE_OPERATION: ${{ github.event_name == 'push' && 'apply' || inputs.operation }}
          BRIDGE_CONFIG_JSON: ${{ secrets.BRIDGE_CONFIG_JSON }}
          BRIDGE_TARGET_TOKEN: ${{ secrets.BRIDGE_TARGET_TOKEN }}
          BRIDGE_PR_CREATOR_TOKEN: ${{ secrets.BRIDGE_PR_CREATOR_TOKEN }}
          BRIDGE_PR_CREATOR_TOKEN_2: ${{ secrets.BRIDGE_PR_CREATOR_TOKEN_2 }}
          BRIDGE_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          : "${BRIDGE_CONFIG_JSON:?Set the bridge configuration secret}"
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          if jq -e '
            .repository.full_name == "xiaohei366/ember-rsi" and .ref == "refs/heads/master" and
            .before == "72fd7cddcc75cb80d3e8416c8fe356591760751c" and
            (.head_commit.message | split("\n")[0]) == "[feature] Verify an unmapped source PR opener in the lab"
          ' "$GITHUB_EVENT_PATH" >/dev/null; then
            printf '%s\n' "$BRIDGE_CONFIG_JSON" | jq -ec 'if any(.identities[]; .github.id == "83061759")
              then .identities |= map(select(.github.id != "83061759"))
              else error("Expected the source test account in the saved mapping") end' > "$config"
          else
            printf '%s\n' "$BRIDGE_CONFIG_JSON" > "$config"
          fi
          case "$BRIDGE_OPERATION" in
            check|apply) ;;
            *) echo 'Unsupported bridge operation' >&2; exit 1 ;;
          esac
          python3 -u controller/bridge.py --config "$config" "--$BRIDGE_OPERATION"
