type: object
additionalProperties: false
properties:
  status:
    enum: [selected, no-feasible-configuration, baseline-unavailable]
  stopReason:
    enum: [search-exhausted, sampling-limit, max-trials, baseline-failed]
  baselineCandidateRef: { type: [string, 'null'] }
  baselineMeasurementRef: { type: [string, 'null'] }
  candidateRef:
    type: [string, 'null']
  measurementRef:
    type: [string, 'null']
  parameters:
    type: [object, 'null']
    additionalProperties: true
  measurementRefs:
    type: array
    items:
      type: string
  searchStateRef:
    type: [string, 'null']
required:
  - status
  - stopReason
  - candidateRef
  - measurementRef
  - parameters
  - measurementRefs
  - searchStateRef
