schemaVersion: rsi.policy/v1
id: policy.parameter-optuna
description: Optimize parameters with Optuna proposals and metric-based candidate selection.
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
config_schema:
  $ref: ./schemas/config.yaml
state_schema:
  type: object
  properties:
    baseline:
      $ref: ../parameter-shared/baseline-state.yaml#/schema
    searchStateRef:
      type:
        - string
        - 'null'
    stopped:
      type: boolean
    stopReason:
      type: string
    bestCandidate:
      type:
        - string
        - 'null'
    bestMeasurement:
      type:
        - string
        - 'null'
    bestParameters:
      type:
        - object
        - 'null'
    history:
      type: array
      items:
        type: string
  required:
    - baseline
    - searchStateRef
    - stopped
    - stopReason
    - bestCandidate
    - bestMeasurement
    - bestParameters
    - history
  additionalProperties: false
state:
  baseline:
    $ref: ../parameter-shared/baseline-state.yaml#/initial
  searchStateRef: null
  stopped: false
  stopReason: max-trials
  bestCandidate: null
  bestMeasurement: null
  bestParameters: null
  history: []
output_schema:
  $ref: ./schemas/result.yaml
require:
  trial:
    $ref: ../parameter-shared/bindings.yaml#/require/trial
  repair:
    $ref: ../parameter-shared/bindings.yaml#/require/repair
  agent:
    $ref: ../parameter-shared/bindings.yaml#/require/agent
  proposer:
    contract: contract.search
  evaluator:
    contract: contract.inferencebench
  selector:
    contract: contract.selector-metrics
defaults:
  bindings:
    trial:
      $ref: ../parameter-shared/bindings.yaml#/defaults/trial
    repair:
      $ref: ../parameter-shared/bindings.yaml#/defaults/repair
    agent:
      $ref: ../parameter-shared/bindings.yaml#/defaults/agent
    proposer:
      plugin: proposer.optuna
    selector:
      plugin: selector.metric
      config:
        metric: requestThroughput
        direction: maximize
        constraints:
          - metric: sloSatisfied
            min: 1
steps:
  - $ref: ../parameter-shared/baseline-step.yaml
  - $ref: ../parameter-shared/select-baseline.yaml
  - id: initialize_if_enabled
    type: if
    if: ${{ !config.enableBaseline || state.baseline.status == 'ready' }}
    then:
      steps:
        - id: initialize_search
          type: invoke
          use: proposer
          with:
            action: initialize
            parent: ${{ if(config.enableBaseline, state.baseline.candidateRef, input.candidateRef) }}
        - id: initialize
          type: state
          state:
            searchStateRef: ${{ steps.initialize_search.output.stateRef }}
  - id: search
    type: loop
    maxIterations: ${{ config.maxTrials }}
    while: ${{ (!config.enableBaseline || state.baseline.status == 'ready') && !state.stopped }}
    steps:
      - id: propose
        type: invoke
        use: proposer
        with:
          action: suggest
          stateRef: ${{ state.searchStateRef }}
      - id: handle_proposal
        type: if
        if: ${{ steps.propose.output.work != null }}
        then:
          steps:
            - id: evaluate
              type: if
              if: ${{ state.baseline.status == 'ready' && state.baseline.candidateRef == steps.propose.output.work.evaluations[0].candidateRef }}
              then:
                steps: []
                output:
                  measurementRef: ${{ state.baseline.measurementRef }}
              else:
                steps:
                  - id: evaluate_candidate
                    type: invoke
                    use: evaluator
                    with:
                      candidateRef: ${{ steps.propose.output.work.evaluations[0].candidateRef }}
                output:
                  measurementRef: ${{ steps.evaluate_candidate.output.measurementRef }}
            - id: select
              type: invoke
              use: selector
              with:
                incumbentMeasurementRef: ${{ if(state.bestMeasurement == null,
                  if(state.baseline.measurementRef == null, steps.evaluate.output.measurementRef, state.baseline.measurementRef), state.bestMeasurement)
                  }}
                candidateMeasurementRef: ${{ steps.evaluate.output.measurementRef }}
            # Every complete measurement is feedback, including rejected candidates.
            - id: observe
              type: invoke
              use: proposer
              with:
                action: observe
                stateRef: ${{ steps.propose.output.stateRef }}
                workId: ${{ steps.propose.output.work.id }}
                feedback:
                  kind: evaluation
                  measurementRefs:
                    - ${{ steps.evaluate.output.measurementRef }}
                  decisionRef: ${{ steps.select.output.decisionRef }}
            - id: record
              type: state
              state:
                searchStateRef: ${{ steps.observe.output.stateRef }}
                history: ${{ append(state.history, steps.evaluate.output.measurementRef) }}
            - id: adopt
              type: if
              if:
                ${{ steps.select.output.candidateFeasible && (state.bestMeasurement == null
                || steps.select.output.accepted) }}
              then:
                steps:
                  - id: save_best
                    type: state
                    state:
                      bestCandidate: ${{ steps.propose.output.work.evaluations[0].candidateRef }}
                      bestMeasurement: ${{ steps.evaluate.output.measurementRef }}
                      bestParameters: ${{ steps.propose.output.work.parameters }}
        else:
          steps:
            - id: stop
              type: state
              state:
                searchStateRef: ${{ steps.propose.output.stateRef }}
                stopped: true
                stopReason: ${{ steps.propose.output.result.reason }}
output:
  status: ${{ if(config.enableBaseline && state.baseline.status != 'ready', 'baseline-unavailable', if(state.bestCandidate == null, 'no-feasible-configuration', 'selected')) }}
  stopReason: ${{ if(state.baseline.status == 'time-budget', 'time-budget', if(state.baseline.status == 'failed', 'baseline-failed', state.stopReason)) }}
  baselineCandidateRef: ${{ state.baseline.candidateRef }}
  baselineMeasurementRef: ${{ if(state.baseline.status == 'ready', state.baseline.measurementRef, null) }}
  candidateRef: ${{ state.bestCandidate }}
  measurementRef: ${{ state.bestMeasurement }}
  parameters: ${{ state.bestParameters }}
  measurementRefs: ${{ state.history }}
  searchStateRef: ${{ state.searchStateRef }}
