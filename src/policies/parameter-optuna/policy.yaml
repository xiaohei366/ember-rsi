schemaVersion: rsi.policy/v1
id: policy.parameter-optuna
description: Optimize parameters with Optuna proposals and metric-based candidate selection.
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
config_schema:
  $ref: ./schemas/config.yaml
state_schema:
  type: object
  properties:
    searchStateRef:
      type:
        - string
        - 'null'
    stopped:
      type: boolean
    stopReason:
      type: string
    bestCandidate:
      type:
        - string
        - 'null'
    bestMeasurement:
      type:
        - string
        - 'null'
    bestParameters:
      type:
        - object
        - 'null'
    history:
      type: array
      items:
        type: string
  required:
    - searchStateRef
    - stopped
    - stopReason
    - bestCandidate
    - bestMeasurement
    - bestParameters
    - history
  additionalProperties: false
state:
  searchStateRef: null
  stopped: false
  stopReason: max-trials
  bestCandidate: null
  bestMeasurement: null
  bestParameters: null
  history: []
output_schema:
  $ref: ./schemas/result.yaml
require:
  proposer:
    contract: contract.search
  evaluator:
    contract: contract.inferencebench
  selector:
    contract: contract.selector-metrics
defaults:
  bindings:
    proposer:
      plugin: proposer.optuna
    selector:
      plugin: selector.metric
      config:
        metric: requestThroughput
        direction: maximize
        constraints:
          - metric: sloSatisfied
            min: 1
steps:
  - id: initialize_search
    type: invoke
    use: proposer
    with:
      action: initialize
      parent: ${{ input.candidateRef }}
  - id: initialize
    type: state
    state:
      searchStateRef: ${{ steps.initialize_search.output.stateRef }}
  - id: search
    type: loop
    maxIterations: ${{ config.maxTrials }}
    while: ${{ !state.stopped }}
    steps:
      - id: propose
        type: invoke
        use: proposer
        with:
          action: suggest
          stateRef: ${{ state.searchStateRef }}
      - id: handle_proposal
        type: if
        if: ${{ steps.propose.output.work != null }}
        then:
          steps:
            - id: evaluate
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ steps.propose.output.work.evaluations[0].candidateRef }}
            - id: select
              type: invoke
              use: selector
              with:
                incumbentMeasurementRef: ${{ if(state.bestMeasurement == null,
                  steps.evaluate.output.measurementRef, state.bestMeasurement)
                  }}
                candidateMeasurementRef: ${{ steps.evaluate.output.measurementRef }}
            # Every complete measurement is feedback, including rejected candidates.
            - id: observe
              type: invoke
              use: proposer
              with:
                action: observe
                stateRef: ${{ steps.propose.output.stateRef }}
                workId: ${{ steps.propose.output.work.id }}
                feedback:
                  kind: evaluation
                  measurementRefs:
                    - ${{ steps.evaluate.output.measurementRef }}
                  decisionRef: ${{ steps.select.output.decisionRef }}
            - id: record
              type: state
              state:
                searchStateRef: ${{ steps.observe.output.stateRef }}
                history: ${{ append(state.history, steps.evaluate.output.measurementRef) }}
            - id: adopt
              type: if
              if:
                ${{ steps.select.output.candidateFeasible && (state.bestMeasurement == null
                || steps.select.output.accepted) }}
              then:
                steps:
                  - id: save_best
                    type: state
                    state:
                      bestCandidate: ${{ steps.propose.output.work.evaluations[0].candidateRef }}
                      bestMeasurement: ${{ steps.evaluate.output.measurementRef }}
                      bestParameters: ${{ steps.propose.output.work.parameters }}
        else:
          steps:
            - id: stop
              type: state
              state:
                searchStateRef: ${{ steps.propose.output.stateRef }}
                stopped: true
                stopReason: ${{ steps.propose.output.result.reason }}
output:
  status: ${{ if(state.bestCandidate == null, 'no-feasible-configuration',
    'selected') }}
  stopReason: ${{ state.stopReason }}
  candidateRef: ${{ state.bestCandidate }}
  measurementRef: ${{ state.bestMeasurement }}
  parameters: ${{ state.bestParameters }}
  measurementRefs: ${{ state.history }}
  searchStateRef: ${{ state.searchStateRef }}
