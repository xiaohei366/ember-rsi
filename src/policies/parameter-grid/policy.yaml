schemaVersion: rsi.policy/v1
id: policy.parameter-grid
description: Search a parameter grid and select candidates by measured metrics.
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
config_schema:
  $ref: ./schemas/config.yaml
state_schema:
  type: object
  properties:
    baseline:
      $ref: ../parameter-shared/baseline-state.yaml#/schema
    cursor:
      type: integer
      minimum: 0
    exhausted:
      type: boolean
    bestCandidate:
      type:
        - string
        - 'null'
    bestMeasurement:
      type:
        - string
        - 'null'
    bestParameters:
      type:
        - object
        - 'null'
    history:
      type: array
      items:
        type: string
  required:
    - baseline
    - cursor
    - exhausted
    - bestCandidate
    - bestMeasurement
    - bestParameters
    - history
  additionalProperties: false
state:
  baseline:
    $ref: ../parameter-shared/baseline-state.yaml#/initial
  cursor: 0
  exhausted: false
  bestCandidate: null
  bestMeasurement: null
  bestParameters: null
  history: []
output_schema:
  $ref: ./schemas/result.yaml
require:
  trial:
    $ref: ../parameter-shared/bindings.yaml#/require/trial
  repair:
    $ref: ../parameter-shared/bindings.yaml#/require/repair
  agent:
    $ref: ../parameter-shared/bindings.yaml#/require/agent
  proposer:
    contract: contract.proposer-grid
  evaluator:
    contract: contract.inferencebench
  selector:
    contract: contract.selector-metrics
defaults:
  bindings:
    trial:
      $ref: ../parameter-shared/bindings.yaml#/defaults/trial
    repair:
      $ref: ../parameter-shared/bindings.yaml#/defaults/repair
    agent:
      $ref: ../parameter-shared/bindings.yaml#/defaults/agent
    proposer:
      plugin: proposer.grid
    selector:
      plugin: selector.metric
      config:
        metric: requestThroughput
        direction: maximize
        constraints:
          - metric: sloSatisfied
            min: 1
steps:
  - $ref: ../parameter-shared/baseline-step.yaml
  - $ref: ../parameter-shared/select-baseline.yaml
  - id: search
    type: loop
    maxIterations: ${{ config.maxCandidates }}
    while: ${{ (!config.enableBaseline || state.baseline.status == 'ready') && !state.exhausted }}
    steps:
      - id: propose
        type: invoke
        use: proposer
        with:
          parent: ${{ if(config.enableBaseline, state.baseline.candidateRef, input.candidateRef) }}
          cursor: ${{ state.cursor }}
      - id: handle_proposal
        type: if
        if: ${{ steps.propose.output.status == 'candidate' }}
        then:
          steps:
            - $ref: ../parameter-shared/evaluate-search-point.yaml
            # Self-comparison checks constraints before the first feasible incumbent.
            - id: select
              type: invoke
              use: selector
              with:
                incumbentMeasurementRef: ${{ if(state.bestMeasurement == null,
                  if(state.baseline.measurementRef == null, steps.evaluate.output.measurementRef, state.baseline.measurementRef), state.bestMeasurement)
                  }}
                candidateMeasurementRef: ${{ steps.evaluate.output.measurementRef }}
            - id: record
              type: state
              state:
                cursor: ${{ steps.propose.output.nextCursor }}
                exhausted: ${{ steps.propose.output.nextCursor >=
                  steps.propose.output.totalCandidates }}
                history: ${{ append(state.history, steps.evaluate.output.measurementRef) }}
            - id: adopt
              type: if
              if:
                ${{ steps.select.output.candidateFeasible && (state.bestMeasurement == null
                || steps.select.output.accepted) }}
              then:
                steps:
                  - id: save_best
                    type: state
                    state:
                      bestCandidate: ${{ steps.propose.output.candidateRef }}
                      bestMeasurement: ${{ steps.evaluate.output.measurementRef }}
                      bestParameters: ${{ steps.propose.output.parameters }}
        else:
          steps:
            - id: exhausted
              type: state
              state:
                exhausted: true
output:
  status: ${{ if(config.enableBaseline && state.baseline.status != 'ready', 'baseline-unavailable', if(state.bestCandidate == null, 'no-feasible-configuration', 'selected')) }}
  stopReason: ${{ if(state.baseline.status == 'failed', 'baseline-failed', if(state.exhausted, 'search-exhausted', 'max-candidates')) }}
  baselineCandidateRef: ${{ state.baseline.candidateRef }}
  baselineMeasurementRef: ${{ if(state.baseline.status == 'ready', state.baseline.measurementRef, null) }}
  candidateRef: ${{ state.bestCandidate }}
  measurementRef: ${{ state.bestMeasurement }}
  parameters: ${{ state.bestParameters }}
  measurementRefs: ${{ state.history }}
