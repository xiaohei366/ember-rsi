type: object
additionalProperties: false
properties:
  status: { enum: [selected, no-feasible-configuration, baseline-unavailable] }
  stopReason: { enum: [max-trials, time-budget, no-change, baseline-failed] }
  baselineCandidateRef: { type: [string, 'null'] }
  baselineMeasurementRef: { type: [string, 'null'] }
  baselineReason: { type: [string, 'null'] }
  candidateRef: { type: [string, 'null'] }
  measurementRef: { type: [string, 'null'] }
  trials:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        candidateRef: { type: string }
        measurementRef: { type: [string, 'null'] }
        status:
          { enum: [measured, startup-failed, invalid-measurement, duplicate] }
        reason: { type: [string, 'null'] }
        accepted: { type: boolean }
      required: [candidateRef, measurementRef, status, reason, accepted]
required:
  [
    status,
    stopReason,
    baselineCandidateRef,
    baselineMeasurementRef,
    baselineReason,
    candidateRef,
    measurementRef,
    trials,
  ]
