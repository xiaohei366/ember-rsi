schemaVersion: rsi.policy/v1
id: policy.harness2
description: Optimize agent harnesses through invariant, domain and composition
  proposals with memory and reflection.
input_schema:
  $ref: ../../contracts/policies/candidate-input.yaml
config_schema:
  $ref: ./schemas/harness2-config.yaml
state_schema:
  type: object
  properties:
    deliveries:
      type: array
      items:
        type: object
    wikiRef:
      type:
        - string
        - 'null'
  required:
    - deliveries
    - wikiRef
  additionalProperties: false
state:
  deliveries: []
  wikiRef: null
output_schema:
  $ref: ./schemas/task-deliveries.yaml
require:
  agent:
    contract: contract.agent
  invariantProposer:
    contract: contract.proposer
  domainProposer:
    contract: contract.proposer
  composer:
    contract: contract.proposer
  evaluator:
    contract: contract.agentbench
  selector:
    contract: contract.selector-artifacts
  memoryUpdater:
    contract: contract.memory
defaults:
  # Memory retains task experience; explicit Reflection separately improves the
  # optimizer's guidance through its own resource versions.
  reflection:
    configFile: ./reflection.yaml
  # Harness² paper §2.2–2.3 / appendix H: editors and experience extraction
  # use execution evidence, never verifier scores, rewards, rubrics or test verdicts.
  # Evaluator still archives scoring for reporting; it is not learning input here.
  bindings:
    agent:
      plugin: agent.pi
      config:
        model: ${MODEL_NAME}
        base_url: ${MODEL_ENDPOINT}
        api_key: ${MODEL_API_KEY}
        retries: 3
        retryBaseDelayMs: 2000
    invariantProposer:
      plugin: proposer.agent
      config:
        evidenceView: execution
        agentRef: agent
        prompt: ./prompts/invariant.md
        guidance: ./guidance/invariant-proposer
        skills: [./skills/harness-edit]
    domainProposer:
      plugin: proposer.agent
      config:
        evidenceView: execution
        agentRef: agent
        prompt: ./prompts/domain.md
        guidance: ./guidance/domain-proposer
        skills: [./skills/harness-edit]
    composer:
      plugin: proposer.agent
      config:
        evidenceView: execution
        agentRef: agent
        prompt: ./prompts/compose.md
        skills: [./skills/harness-edit]
    # Final selection compares anonymous deliverables via the delivery capability,
    # independently of the evaluator scores retained for reporting.
    selector:
      plugin: selector.artifact
      config:
        agentRef: agent
        prompt: ./prompts/select-delivery.md
    memoryUpdater:
      plugin: memory.agent
      config:
        evidenceView: execution
        agentRef: agent
        prompt: ./memory.md
steps:
  - id: search
    type: loop
    maxIterations: ${{ size(config.dataset.taskIds) }}
    steps:
      - id: base
        type: foreach
        foreach: ${{ range(0, config.k) }}
        as: slot
        key: ${{ slot }}
        concurrency: ${{ config.concurrency }}
        steps:
          - id: execute_base
            type: invoke
            use: evaluator
            with:
              candidateRef: ${{ input.candidateRef }}
              taskIds:
                - ${{ config.dataset.taskIds[loop.index] }}
        output:
          slot: ${{ slot }}
          candidateRef: ${{ input.candidateRef }}
          measurementRef: ${{ steps.execute_base.output.measurementRef }}
      - id: probes
        type: foreach
        foreach: [inv, dom]
        as: arm
        key: ${{ arm }}
        concurrency: 2
        steps:
          - id: run_arm
            type: if
            if: ${{ arm == 'inv' }}
            then:
              steps:
                - id: invariant
                  type: foreach
                  foreach: ${{ steps.base.output }}
                  as: base
                  key: ${{ base.slot }}
                  concurrency: ${{ config.concurrency }}
                  steps:
                    - id: propose_inv
                      type: invoke
                      use: invariantProposer
                      with:
                        parent: ${{ input.candidateRef }}
                        goal: Improve general execution, tool use, and completion checks.
                        evidenceRefs:
                          - ${{ base.measurementRef }}
                        memoryRef: ${{ state.wikiRef }}
                    - id: execute_inv
                      type: invoke
                      use: evaluator
                      with:
                        candidateRef: ${{ steps.propose_inv.output.candidateRef }}
                        taskIds:
                          - ${{ config.dataset.taskIds[loop.index] }}
                  output:
                    candidateRef: ${{ steps.propose_inv.output.candidateRef }}
                    measurementRef: ${{ steps.execute_inv.output.measurementRef }}
              output: ${{ steps.invariant.output }}
            else:
              steps:
                - id: domain
                  type: foreach
                  foreach: ${{ steps.base.output }}
                  as: base
                  key: ${{ base.slot }}
                  concurrency: ${{ config.concurrency }}
                  steps:
                    - id: propose_dom
                      type: invoke
                      use: domainProposer
                      with:
                        parent: ${{ input.candidateRef }}
                        goal:
                          Improve task-family analysis and deliverable generation using authorized
                          evidence.
                        evidenceRefs:
                          - ${{ base.measurementRef }}
                        memoryRef: ${{ state.wikiRef }}
                    - id: execute_dom
                      type: invoke
                      use: evaluator
                      with:
                        candidateRef: ${{ steps.propose_dom.output.candidateRef }}
                        taskIds:
                          - ${{ config.dataset.taskIds[loop.index] }}
                  output:
                    candidateRef: ${{ steps.propose_dom.output.candidateRef }}
                    measurementRef: ${{ steps.execute_dom.output.measurementRef }}
              output: ${{ steps.domain.output }}
        output: ${{ steps.run_arm.output }}
      - id: compose
        type: foreach
        foreach: ${{ steps.base.output }}
        as: base
        key: ${{ base.slot }}
        concurrency: ${{ config.concurrency }}
        steps:
          - id: compose_candidate
            type: invoke
            use: composer
            with:
              parent: ${{ input.candidateRef }}
              goal:
                Compose supported, compatible improvements while preserving a complete,
                runnable application.
              sources: ${{ flatten(steps.probes.output) }}
              evidenceRefs:
                - ${{ base.measurementRef }}
              memoryRef: ${{ state.wikiRef }}
          - id: execute_composed
            type: invoke
            use: evaluator
            with:
              candidateRef: ${{ steps.compose_candidate.output.candidateRef }}
              taskIds:
                - ${{ config.dataset.taskIds[loop.index] }}
        output:
          candidateRef: ${{ steps.compose_candidate.output.candidateRef }}
          measurementRef: ${{ steps.execute_composed.output.measurementRef }}
      - id: select
        type: invoke
        use: selector
        with:
          candidates: ${{ steps.compose.output }}
          rubric:
            Select the final deliverable based on the user request, completeness,
            correctness, and observable usability.
      - id: retain_delivery
        type: state
        state:
          deliveries: ${{ append(state.deliveries, steps.select.output) }}
      - id: remember_if_enabled
        type: if
        if: ${{ config.memory }}
        then:
          steps:
            - id: remember
              type: invoke
              use: memoryUpdater
              with:
                memoryRef: ${{ state.wikiRef }}
                goal:
                  Maintain compact harness-improvement experience from this task's supplied
                  execution contrasts. Preserve sources, confounding and
                  unresolved edit attribution; do not cache task answers.
                evidenceRefs:
                  ${{ concat(concat(pluck(steps.base.output, 'measurementRef'),
                  pluck(steps.probes.output[0], 'measurementRef')),
                  concat(pluck(steps.probes.output[1], 'measurementRef'),
                  pluck(steps.compose.output, 'measurementRef'))) }}
                # Compare snapshots with H0, every probe and the saved selection,
                # without exposing grades to the learning operation.
                comparison:
                  baselineCandidateRef: ${{ input.candidateRef }}
                  probes:
                    base: ${{ steps.base.output }}
                    invariant: ${{ steps.probes.output[0] }}
                    domain: ${{ steps.probes.output[1] }}
                    compose: ${{ steps.compose.output }}
                  selection: ${{ steps.select.output }}
            - id: save_memory
              type: state
              state:
                wikiRef: ${{ steps.remember.output.memoryRef }}
    # - id: improve_guidance
    #   type: reflection
output:
  baseline: ${{ input.candidateRef }}
  deliveries: ${{ state.deliveries }}
