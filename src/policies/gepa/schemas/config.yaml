type: object
additionalProperties: false
required: [dataset]
properties:
  dataset:
    type: object
    additionalProperties: false
    required: [trainTaskIds, validationTaskIds]
    properties:
      trainTaskIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
      validationTaskIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
