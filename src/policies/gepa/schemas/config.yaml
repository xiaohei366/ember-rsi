type: object
additionalProperties: false
required:
  - feedbackTaskIds
  - selectionTaskIds
  - maxRounds
  - maxRollouts
  - minibatchSize
  - paretoSize
  - seed
  - crossoverEvery
  - modules
  - goal
properties:
  feedbackTaskIds:
    type: array
    minItems: 1
    uniqueItems: true
    items: { type: string, minLength: 1 }
  selectionTaskIds:
    type: array
    minItems: 1
    uniqueItems: true
    items: { type: string, minLength: 1 }
  maxRounds:
    type: integer
    minimum: 0
    maximum: 100000
  maxRollouts:
    type: integer
    minimum: 0
    maximum: 1000000000
  minibatchSize:
    type: integer
    minimum: 1
    maximum: 100000
  paretoSize:
    type: integer
    minimum: 1
    maximum: 100000
  seed:
    type: integer
    minimum: 0
    maximum: 2147483647
  crossoverEvery:
    type: integer
    minimum: 0
    maximum: 100000
  modules:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, path]
      properties:
        id: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
  goal:
    type: string
    minLength: 1
  editConstraints:
    type: object
