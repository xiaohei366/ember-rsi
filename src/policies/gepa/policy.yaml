schemaVersion: rsi.policy/v1
id: policy.gepa
description: >-
  GEPA reflective prompt evolution over a modular file target. Candidates are
  sampled from the instance-wise Pareto frontier, mutated with sampled execution
  feedback, merged through ancestry-aware crossover, and compared against their
  genetic parents before selection scoring.
input_schema:
  type: object
  additionalProperties: false
  required: [candidateRef]
  properties:
    candidateRef: { type: string, minLength: 1 }
config_schema:
  $ref: ./schemas/config.yaml
state_schema:
  type: object
  additionalProperties: false
  required: [optimizer, plan]
  properties:
    optimizer: { type: object }
    plan: { type: [object, 'null'] }
state:
  optimizer: {}
  plan: null
output_schema:
  $ref: ./schemas/output.yaml
require:
  optimizer:
    contract: contract.gepa-optimizer
  evaluator:
    contract: contract.agentbench
  proposer:
    contract: contract.proposer
  agent:
    contract: contract.agent
defaults:
  bindings:
    optimizer:
      plugin: gepa.optimizer
    proposer:
      plugin: proposer.agent
      config:
        agentRef: agent
        prompt: ./prompts/mutation.md
        evidenceView: training-summary
        maxModelCalls: 32
steps:
  - id: initialize
    type: invoke
    use: optimizer
    with:
      action: initialize
      candidateRef: ${{ input.candidateRef }}
      settings: ${{ config }}
  - id: save_initial
    type: state
    state:
      optimizer: ${{ steps.initialize.output.state }}
      plan: ${{ steps.initialize.output.plan }}
  - id: initial_evaluation
    type: if
    if: ${{ size(state.optimizer.selectionTaskIds) > 0 }}
    then:
      steps:
        - id: evaluate
          type: invoke
          use: evaluator
          with:
            candidateRef: ${{ input.candidateRef }}
            taskIds: ${{ state.optimizer.selectionTaskIds }}
      output: ${{ steps.evaluate.output.measurementRef }}
    else:
      steps: []
      output: null
  - id: observe_initial
    type: invoke
    use: optimizer
    with:
      action: observe-initial
      state: ${{ state.optimizer }}
      settings: ${{ config }}
      measurementRef: ${{ steps.initial_evaluation.output }}
  - id: save_observed
    type: state
    state:
      optimizer: ${{ steps.observe_initial.output.state }}
      plan: ${{ steps.observe_initial.output.plan }}
  - id: optimize
    type: loop
    maxIterations: ${{ config.maxRounds }}
    while: ${{ !state.optimizer.done }}
    steps:
      - id: prepare
        type: invoke
        use: optimizer
        with:
          action: prepare
          state: ${{ state.optimizer }}
          settings: ${{ config }}
      - id: save_plan
        type: state
        state:
          optimizer: ${{ steps.prepare.output.state }}
          plan: ${{ steps.prepare.output.plan }}
      - id: stop_if_done
        type: if
        if: ${{ state.plan == null }}
        then:
          steps:
            - id: stop
              type: control
              control: break
      - id: proposal
        type: if
        if: ${{ state.plan.proposalInput != null }}
        then:
          steps:
            - id: evaluate_parent
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ state.plan.proposalInput.parent }}
                taskIds: ${{ state.plan.report.taskIds }}
            - id: propose
              type: invoke
              use: proposer
              with:
                parent: ${{ state.plan.proposalInput.parent }}
                goal: ${{ state.plan.proposalInput.goal }}
                editConstraints: ${{ state.plan.proposalInput.editConstraints }}
                evidenceRefs:
                  - ${{ steps.evaluate_parent.output.measurementRef }}
          output:
            proposal: ${{ steps.propose.output }}
            parentMeasurementRefs:
              - ${{ steps.evaluate_parent.output.measurementRef }}
        else:
          steps:
            - id: evaluate_merge_parents
              type: if
              if: ${{ state.plan.proposalResult.status == 'created' }}
              then:
                steps:
                  - id: parents
                    type: foreach
                    foreach: ${{ state.plan.report.parentRefs }}
                    as: parent
                    key: ${{ parent }}
                    steps:
                      - id: evaluate
                        type: invoke
                        use: evaluator
                        with:
                          candidateRef: ${{ parent }}
                          taskIds: ${{ state.plan.report.taskIds }}
                    output: ${{ steps.evaluate.output.measurementRef }}
                output: ${{ steps.parents.output }}
              else:
                steps: []
                output: []
          output:
            proposal: ${{ state.plan.proposalResult }}
            parentMeasurementRefs: ${{ steps.evaluate_merge_parents.output }}
      - id: proposal_evaluation
        type: if
        if: ${{ steps.proposal.output.proposal.status == 'created' }}
        then:
          steps:
            - id: evaluate
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ steps.proposal.output.proposal.candidateRef }}
                taskIds: ${{ state.plan.report.taskIds }}
          output: ${{ steps.evaluate.output.measurementRef }}
        else:
          steps: []
          output: null
      - id: compare
        type: invoke
        use: optimizer
        with:
          action: compare
          state: ${{ state.optimizer }}
          settings: ${{ config }}
          plan: ${{ state.plan }}
          parentMeasurementRefs: ${{ steps.proposal.output.parentMeasurementRefs }}
          proposal: ${{ steps.proposal.output.proposal }}
          proposalMeasurementRef: ${{ steps.proposal_evaluation.output }}
      - id: save_comparison
        type: state
        state:
          optimizer: ${{ steps.compare.output.state }}
          plan: ${{ steps.compare.output.plan }}
      - id: select_if_accepted
        type: if
        if: ${{ steps.compare.output.selectionRequired }}
        then:
          steps:
            - id: evaluate_selection
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ state.plan.report.candidateRef }}
                taskIds: ${{ state.optimizer.selectionTaskIds }}
            - id: select
              type: invoke
              use: optimizer
              with:
                action: select
                state: ${{ state.optimizer }}
                settings: ${{ config }}
                plan: ${{ state.plan }}
                measurementRef: ${{ steps.evaluate_selection.output.measurementRef }}
            - id: save_selection
              type: state
              state:
                optimizer: ${{ steps.select.output.state }}
                plan: ${{ steps.select.output.plan }}
output:
  baselineCandidateRef: ${{ state.optimizer.baselineCandidateRef }}
  bestCandidateRef: ${{ state.optimizer.bestCandidateRef }}
  bestAggregateScore: ${{ state.optimizer.bestAggregateScore }}
  completedRounds: ${{ state.optimizer.completedRounds }}
  rolloutsUsed: ${{ state.optimizer.rolloutsUsed }}
  maxRollouts: ${{ config.maxRollouts }}
  feedbackTaskIds: ${{ state.optimizer.feedbackTaskIds }}
  selectionTaskIds: ${{ state.optimizer.selectionTaskIds }}
  datasetDegenerate: ${{ state.optimizer.datasetDegenerate }}
  stopReason: ${{ state.optimizer.stopReason }}
  candidates: ${{ state.optimizer.candidates }}
  rounds: ${{ state.optimizer.rounds }}
  weightsChanged: false
