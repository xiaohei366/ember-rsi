schemaVersion: rsi.policy/v1
id: policy.gepa
description: GEPA reflective prompt evolution over a modular file target.
  Candidates are sampled from the instance-wise Pareto frontier, mutated with
  sampled execution feedback, merged through ancestry-aware crossover, and
  compared against their genetic parents before selection scoring.
input_schema:
  type: object
  additionalProperties: false
  required:
    - candidateRef
  properties:
    candidateRef:
      type: string
      minLength: 1
config_schema:
  $ref: ./schemas/config.yaml
state_schema:
  type: object
  additionalProperties: false
  required:
    - search
  properties:
    search:
      type: object
state:
  search: {}
output_schema:
  $ref: ./schemas/output.yaml
require:
  search:
    contract: contract.population-search
  evaluator:
    contract: contract.agentbench
  proposer:
    contract: contract.proposer
  agent:
    contract: contract.agent
defaults:
  bindings:
    search:
      plugin: search.gepa
    proposer:
      plugin: proposer.agent
      config:
        agentRef: agent
        prompt: ./prompts/mutation.md
        evidenceView: training-summary
steps:
  - id: initialize
    type: invoke
    use: search
    with:
      action: initialize
      candidateRef: ${{ input.candidateRef }}
      feedbackTaskIds: ${{ config.dataset.trainTaskIds }}
      selectionTaskIds: ${{ config.dataset.validationTaskIds }}
  - id: save_initial
    type: state
    state:
      search: ${{ steps.initialize.output }}
  - id: initial_evaluation
    type: if
    if: ${{ state.search.evaluation != null }}
    then:
      steps:
        - id: evaluate
          type: invoke
          use: evaluator
          with:
            candidateRef: ${{ input.candidateRef }}
            taskIds: ${{ state.search.evaluation.taskIds }}
      output: ${{ steps.evaluate.output.measurementRef }}
    else:
      steps: []
      output: null
  - id: observe_initial
    type: invoke
    use: search
    with:
      action: observe-initial
      measurementRef: ${{ steps.initial_evaluation.output }}
      stateRef: ${{ state.search.stateRef }}
  - id: save_observed
    type: state
    state:
      search: ${{ steps.observe_initial.output }}
  - id: optimize
    type: loop
    maxIterations: ${{ state.search.iterationLimit }}
    while: ${{ !state.search.done }}
    steps:
      - id: prepare
        type: invoke
        use: search
        with:
          action: prepare
          stateRef: ${{ state.search.stateRef }}
      - id: save_plan
        type: state
        state:
          search: ${{ steps.prepare.output }}
      - id: stop_if_done
        type: if
        if: ${{ state.search.plan == null }}
        then:
          steps:
            - id: stop
              type: control
              control: break
      - id: proposal
        type: if
        if: ${{ state.search.plan.proposalInput != null }}
        then:
          steps:
            - id: evaluate_parent
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ state.search.plan.proposalInput.parent }}
                taskIds: ${{ state.search.plan.taskIds }}
            - id: propose
              type: invoke
              use: proposer
              with:
                parent: ${{ state.search.plan.proposalInput.parent }}
                goal: ${{ state.search.plan.proposalInput.goal }}
                editConstraints: ${{ state.search.plan.proposalInput.editConstraints }}
                evidenceRefs:
                  - ${{ steps.evaluate_parent.output.measurementRef }}
          output:
            proposal: ${{ steps.propose.output }}
            parentMeasurementRefs:
              - ${{ steps.evaluate_parent.output.measurementRef }}
        else:
          steps:
            - id: evaluate_merge_parents
              type: if
              if: ${{ state.search.plan.proposalResult.status == 'created' }}
              then:
                steps:
                  - id: parents
                    type: foreach
                    foreach: ${{ state.search.plan.parentRefs }}
                    as: parent
                    key: ${{ parent }}
                    steps:
                      - id: evaluate
                        type: invoke
                        use: evaluator
                        with:
                          candidateRef: ${{ parent }}
                          taskIds: ${{ state.search.plan.taskIds }}
                    output: ${{ steps.evaluate.output.measurementRef }}
                output: ${{ steps.parents.output }}
              else:
                steps: []
                output: []
          output:
            proposal: ${{ state.search.plan.proposalResult }}
            parentMeasurementRefs: ${{ steps.evaluate_merge_parents.output }}
      - id: proposal_evaluation
        type: if
        if: ${{ steps.proposal.output.proposal.status == 'created' }}
        then:
          steps:
            - id: evaluate
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ steps.proposal.output.proposal.candidateRef }}
                taskIds: ${{ state.search.plan.taskIds }}
          output: ${{ steps.evaluate.output.measurementRef }}
        else:
          steps: []
          output: null
      - id: compare
        type: invoke
        use: search
        with:
          action: compare
          parentMeasurementRefs: ${{ steps.proposal.output.parentMeasurementRefs }}
          proposal: ${{ steps.proposal.output.proposal }}
          proposalMeasurementRef: ${{ steps.proposal_evaluation.output }}
          stateRef: ${{ state.search.stateRef }}
      - id: save_comparison
        type: state
        state:
          search: ${{ steps.compare.output }}
      - id: select_if_accepted
        type: if
        if: ${{ steps.compare.output.evaluation != null }}
        then:
          steps:
            - id: evaluate_selection
              type: invoke
              use: evaluator
              with:
                candidateRef: ${{ state.search.evaluation.candidateRef }}
                taskIds: ${{ state.search.evaluation.taskIds }}
            - id: select
              type: invoke
              use: search
              with:
                action: select
                measurementRef: ${{ steps.evaluate_selection.output.measurementRef }}
                stateRef: ${{ state.search.stateRef }}
            - id: save_selection
              type: state
              state:
                search: ${{ steps.select.output }}
output: ${{ state.search.result }}
