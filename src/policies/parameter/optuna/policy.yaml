schemaVersion: rsi.policy/v1
id: policy.parameter-optuna
description: Optimize parameters with Optuna proposals and metric-based candidate selection.
# policy schema
input_schema:
  $ref: ../../../contracts/policies/candidate-input.yaml
input:
  candidateRef: ${{ application.initialCandidate }}
output_schema:
  $ref: ./schemas/result.yaml
config_schema:
  $ref: ./schemas/config.yaml

# setup
state_schema:
  $ref: ./setup.yaml#/state_schema
state:
  $ref: ./setup.yaml#/state
require:
  $ref: ./setup.yaml#/require
defaults:
  $ref: ./setup.yaml#/defaults

# policy steps
steps:
  - id: baseline
    type: invoke
    use: evaluator
    with:
      candidateRef: ${{ input.candidateRef }}
  - id: baseline_feasibility
    type: invoke
    use: selector
    with:
      incumbentMeasurementRef: ${{ steps.baseline.output.measurementRef }}
      candidateMeasurementRef: ${{ steps.baseline.output.measurementRef }}
  - id: seed_best
    type: state
    state:
      bestCandidate: ${{ if(steps.baseline_feasibility.output.candidateFeasible, input.candidateRef, null) }}
      bestMeasurement: ${{ if(steps.baseline_feasibility.output.candidateFeasible, steps.baseline.output.measurementRef, null) }}
  - id: initialize_search
    type: invoke
    use: proposer
    with:
      action: initialize
      parent: ${{ input.candidateRef }}
  - id: initialize
    type: state
    state:
      searchStateRef: ${{ steps.initialize_search.output.stateRef }}
  - id: search
    type: loop
    maxIterations: ${{ config.maxTrials }}
    while: ${{ !state.stopped }}
    steps:
      - id: propose
        type: invoke
        use: proposer
        with:
          action: suggest
          stateRef: ${{ state.searchStateRef }}
      - id: handle_proposal
        type: if
        if: ${{ steps.propose.output.work != null }}
        then:
          steps:
            - id: evaluate
              type: if
              if: ${{ input.candidateRef == steps.propose.output.work.evaluations[0].candidateRef }}
              then:
                steps: []
                output:
                  measurementRef: ${{ steps.baseline.output.measurementRef }}
              else:
                steps:
                  - id: evaluate_candidate
                    type: invoke
                    use: evaluator
                    with:
                      candidateRef: ${{ steps.propose.output.work.evaluations[0].candidateRef }}
                output:
                  measurementRef: ${{ steps.evaluate_candidate.output.measurementRef }}
            - id: select
              type: invoke
              use: selector
              with:
                incumbentMeasurementRef: ${{ if(state.bestMeasurement == null, steps.baseline.output.measurementRef, state.bestMeasurement)}}
                candidateMeasurementRef: ${{ steps.evaluate.output.measurementRef }}
            # Every complete measurement is feedback, including rejected candidates.
            - id: observe
              type: invoke
              use: proposer
              with:
                action: observe
                stateRef: ${{ steps.propose.output.stateRef }}
                workId: ${{ steps.propose.output.work.id }}
                feedback:
                  kind: evaluation
                  measurementRefs:
                    - ${{ steps.evaluate.output.measurementRef }}
                  decisionRef: ${{ steps.select.output.decisionRef }}
            - id: record
              type: state
              state:
                searchStateRef: ${{ steps.observe.output.stateRef }}
                history: ${{ append(state.history, steps.evaluate.output.measurementRef) }}
            - id: adopt
              type: if
              if:
                ${{ steps.select.output.candidateFeasible && (state.bestMeasurement == null
                || steps.select.output.accepted) }}
              then:
                steps:
                  - id: save_best
                    type: state
                    state:
                      bestCandidate: ${{ steps.propose.output.work.evaluations[0].candidateRef }}
                      bestMeasurement: ${{ steps.evaluate.output.measurementRef }}
                      bestParameters: ${{ steps.propose.output.work.parameters }}
        else:
          steps:
            - id: stop
              type: state
              state:
                searchStateRef: ${{ steps.propose.output.stateRef }}
                stopped: true
                stopReason: ${{ steps.propose.output.result.reason }}

# output
output:
  status: ${{ if(state.bestCandidate == null, 'no-feasible-configuration', 'selected') }}
  stopReason: ${{ state.stopReason }}
  baselineCandidateRef: ${{ input.candidateRef }}
  baselineMeasurementRef: ${{ steps.baseline.output.measurementRef }}
  candidateRef: ${{ state.bestCandidate }}
  measurementRef: ${{ state.bestMeasurement }}
  parameters: ${{ state.bestParameters }}
  measurementRefs: ${{ state.history }}
  searchStateRef: ${{ state.searchStateRef }}
