type: object
additionalProperties: false
properties:
  status: { enum: [selected, no-feasible-configuration] }
  stopReason: { enum: [max-trials, no-change] }
  baselineCandidateRef: { type: string, minLength: 1 }
  baselineMeasurementRef: { type: string, minLength: 1 }
  candidateRef: { type: [string, 'null'] }
  measurementRef: { type: [string, 'null'] }
  trials:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        candidateRef: { type: string }
        measurementRef: { type: [string, 'null'] }
        status:
          { enum: [measured, startup-failed, invalid-measurement, duplicate] }
        reason: { type: [string, 'null'] }
        accepted: { type: boolean }
      required: [candidateRef, measurementRef, status, reason, accepted]
required:
  [
    status,
    stopReason,
    baselineCandidateRef,
    baselineMeasurementRef,
    candidateRef,
    measurementRef,
    trials,
  ]
