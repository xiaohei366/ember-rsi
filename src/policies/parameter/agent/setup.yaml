state_schema:
  type: object
  additionalProperties: false
  properties:
    incumbent: { type: [string, 'null'] }
    incumbentMeasurement: { type: [string, 'null'] }
    incumbentFeasible: { type: boolean }
    stopReason: { enum: [max-trials, no-change] }
    sources: { type: array, items: { type: object } }
    trials:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          candidateRef: { type: string }
          measurementRef: { type: string, minLength: 1 }
          status: { const: measured }
          reason: { type: string }
          accepted: { type: boolean }
          candidateFeasible: { type: boolean }
        required:
          [
            candidateRef,
            measurementRef,
            status,
            reason,
            accepted,
            candidateFeasible,
          ]
  required:
    [
      incumbent,
      incumbentMeasurement,
      incumbentFeasible,
      stopReason,
      trials,
      sources,
    ]
state:
  incumbent: null
  incumbentMeasurement: null
  incumbentFeasible: false
  stopReason: max-trials
  trials: []
  sources: []
require:
  proposer: { contract: contract.proposer }
  evaluator: { contract: contract.inferencebench }
  selector: { contract: contract.selector-metrics }
  agent: { contract: contract.agent }
defaults:
  bindings:
    agent: { plugin: agent.codex }
    proposer:
      plugin: proposer.agent
      config: { agentRef: agent }
    selector:
      plugin: selector.inference
      config: { metric: requestThroughput, direction: maximize }
