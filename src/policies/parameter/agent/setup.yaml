state_schema:
  type: object
  additionalProperties: false
  properties:
    incumbent: { type: [string, 'null'] }
    incumbentMeasurement: { type: [string, 'null'] }
    incumbentFeasible: { type: boolean }
    previousNoChangeReason: { type: [string, 'null'] }
    proposalRounds: { type: integer, minimum: 0 }
    sources: { type: array, items: { type: object } }
    trials:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          candidateRef: { type: string }
          measurementRef: { type: string, minLength: 1 }
          status: { const: measured }
          reason: { type: string }
          accepted: { type: boolean }
          candidateFeasible: { type: boolean }
        required:
          [
            candidateRef,
            measurementRef,
            status,
            reason,
            accepted,
            candidateFeasible,
          ]
  required:
    [
      incumbent,
      incumbentMeasurement,
      incumbentFeasible,
      previousNoChangeReason,
      proposalRounds,
      trials,
      sources,
    ]
state:
  incumbent: null
  incumbentMeasurement: null
  incumbentFeasible: false
  previousNoChangeReason: null
  proposalRounds: 0
  trials: []
  sources: []
require:
  proposer: { contract: contract.proposer }
  evaluator: { contract: contract.inferencebench }
  selector: { contract: contract.selector-metrics }
  agent: { contract: contract.agent }
defaults:
  memory:
    enabled: false
    trigger:
      afterIteration: search
    observe:
      steps: [evaluate, select]
      includeBaseline: true
      includeCandidateDiffs: true
      includeCandidateSources: true
    evidenceView: training-summary
    consumers: [proposer]
    goal: >-
      Consolidate measured configuration-search experience, preserving
      sources, counterexamples and applicability conditions.
    plugin: memory.agent
    config:
      agentRef: agent
      prompt: ./memory.md
  reflection:
    enabled: false
    trigger:
      afterIteration: search
      skipFinal: true
    observe:
      bindings: [proposer, evaluator, selector, memory]
    evidenceView: training-summary
    targets:
      proposer:
        resources: [guidance]
    goalFile: ./reflection.md
    plugin: reflection.agent
    config:
      agentRef: agent
  bindings:
    agent: { plugin: agent.codex }
    proposer:
      plugin: proposer.agent
      config: { agentRef: agent, prompt: ./prompt.md, guidance: ./guidance }
    selector:
      plugin: selector.inference
      config: { metric: requestThroughput, direction: maximize }
