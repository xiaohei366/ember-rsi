evaluate:
  - id: assess
    type: if
    if: true
    then:
      steps:
        - id: evaluate
          type: invoke
          use: evaluator
          with:
            candidateRef: ${{ steps.candidates.output[loop.index] }}
        - id: select
          type: invoke
          use: selector
          with:
            incumbentMeasurementRef: ${{ state.incumbentMeasurement }}
            candidateMeasurementRef: ${{ steps.evaluate.output.measurementRef }}
      output:
        trial:
          candidateRef: ${{ steps.candidates.output[loop.index] }}
          measurementRef: ${{ steps.evaluate.output.measurementRef }}
          status: measured
          reason: ${{ steps.select.output.reason }}
          accepted: ${{ steps.select.output.accepted }}
          candidateFeasible: ${{ steps.select.output.candidateFeasible }}
        source:
          candidateRef: ${{ steps.candidates.output[loop.index] }}
  - id: record_trial
    type: state
    state:
      trials: ${{ append(state.trials, steps.assess.output.trial) }}
      sources: ${{ append(state.sources, steps.assess.output.source) }}
      incumbent: ${{ if(steps.assess.output.trial.accepted, steps.assess.output.trial.candidateRef, state.incumbent) }}
      incumbentMeasurement: ${{ if(steps.assess.output.trial.accepted, steps.assess.output.trial.measurementRef, state.incumbentMeasurement) }}
      incumbentFeasible: ${{ if(steps.assess.output.trial.accepted, steps.assess.output.trial.candidateFeasible, state.incumbentFeasible) }}
