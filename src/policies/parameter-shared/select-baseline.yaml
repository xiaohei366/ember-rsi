id: select_baseline
type: if
if: ${{ state.baseline.status == 'ready' }}
then:
  steps:
    - id: select
      type: invoke
      use: selector
      with:
        incumbentMeasurementRef: ${{ state.baseline.measurementRef }}
        candidateMeasurementRef: ${{ state.baseline.measurementRef }}
    - id: seed_best
      type: if
      if: ${{ steps.select.output.candidateFeasible }}
      then:
        steps:
          - id: save_baseline
            type: state
            state:
              bestCandidate: ${{ state.baseline.candidateRef }}
              bestMeasurement: ${{ state.baseline.measurementRef }}
