schemaVersion: rsi.launch/v1
recipe: ./recipe.yaml
title: DSH Harness² · WorkBuddy Office
summary: Explore invariant/domain proposals, compose, and compare anonymously.
idPrefix: harness2
env:
  - { name: MODEL_NAME, label: Optimizer model }
  - { name: EVALUATOR_MODEL_NAME, label: Evaluation model }
  - { name: MODEL_ENDPOINT, label: Model endpoint }
  - { name: MODEL_API_KEY, label: Model API key, secret: true }
groups:
  - title: Dataset
    params:
      - {
          key: tasks,
          label: Evaluation task IDs,
          path: policy.config.dataset.taskIds,
          type: list,
          min: 1,
        }
  - title: Search
    params:
      - {
          key: k,
          label: Exploration width,
          path: policy.config.k,
          type: int,
          min: 1,
          max: 10,
        }
      - {
          key: concurrency,
          label: Exploration slot concurrency per task,
          path: policy.config.concurrency,
          type: int,
          min: 1,
          max: 64,
        }
  - title: Budget
    params:
      - {
          key: wall,
          label: Wall-clock budget,
          path: budget.elapsedWallMs,
          type: duration,
          unit: h,
          store: ms,
        }
  - title: Advanced
    advanced: true
    params:
      - {
          key: evalTimeout,
          label: Evaluation task timeout,
          path: bindings.evaluator.config.run.timeoutSeconds,
          type: duration,
          unit: min,
          store: s,
        }
      - {
          key: agentTimeout,
          label: Agent request timeout,
          path: bindings.agent.config.timeoutMs,
          type: duration,
          unit: min,
          store: ms,
        }
      - {
          key: executionTimeout,
          label: Agent execution timeout,
          path: bindings.agent.config.executionTimeoutMs,
          type: duration,
          unit: min,
          store: ms,
        }
      - {
          key: memory,
          label: Enable Memory,
          path: policy.config.memory,
          type: bool,
        }
estimate:
  factor: 4
  parameters: [k, tasks]
