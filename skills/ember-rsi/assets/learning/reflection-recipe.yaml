schemaVersion: rsi.recipe/v1
id: recipe.skill-reflection
application:
  plugin: application.agentbundle
  config:
    target: { schema: ./target.yaml }
    baseline: { directory: ./baseline }
policy:
  id: policy.skill-reflection
  config: { maxRounds: 2 }
  input: {}
bindings:
  agent:
    plugin: agent.pi
    config:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      api_key: ${MODEL_API_KEY}
      maxTokens: 4096
      timeoutMs: 60000
  proposer:
    plugin: proposer.agent
    config:
      agentRef: agent
      prompt: ./proposer.md
      guidance: ./guidance
  evaluator: { plugin: evaluator.skill-text, config: {} }
  selector:
    {
      plugin: selector.metric,
      config: { metric: checkPhrase, direction: maximize },
    }
reflection: { configFile: ./reflection-only.yaml }
budget:
  modelCalls: 20
  evaluationRuns: 3
  operations: 150
  elapsedWallMs: 600000
  cleanupReserveMs: 5000
