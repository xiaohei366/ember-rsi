schemaVersion: rsi.recipe/v1
id: recipe.skill-learning
application:
  plugin: application.agentbundle
  config:
    target: { schema: ./target.yaml }
    baseline: { directory: ./baseline }
policy:
  id: policy.skill-learning
  config: { maxRounds: 2 }
  input: {}
bindings:
  agent:
    plugin: agent.pi
    config:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      api_key: ${MODEL_API_KEY}
      maxTokens: 4096
      timeoutMs: 60000
  proposer:
    plugin: proposer.agent
    config:
      agentRef: agent
      prompt: ./proposer.md
      guidance: ./guidance
  evaluator: { plugin: evaluator.skill-text, config: {} }
  selector:
    {
      plugin: selector.metric,
      config: { metric: checkPhrase, direction: maximize },
    }
memory:
  trigger: { afterIteration: search, skipFinal: true }
  observe: { bindings: [proposer, evaluator, selector] }
  consumers: [proposer]
  goal: Retain reusable checking procedures supported by execution evidence.
  config: { agentRef: agent, prompt: ./memory.md }
  budget: { modelCalls: 6 }
reflection:
  trigger: { afterIteration: search }
  observe: { bindings: [proposer, evaluator, selector, memory] }
  targets:
    proposer: { resources: [guidance] }
  goalFile: ./reflection-goal.md
  config: { agentRef: agent, prompt: ./reflection.md }
  budget: { modelCalls: 6, timeoutSeconds: 90 }
budget:
  modelCalls: 36
  evaluationRuns: 3
  operations: 150
  elapsedWallMs: 600000
  cleanupReserveMs: 5000
